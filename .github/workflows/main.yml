name: Build Debug APK (Personal Use)

on:
  workflow_dispatch: # 允许你手动点击运行
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          # 如果这里 ndk 版本报错，请改成你项目 gradle 里实际使用的版本
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;29.0.14206865"

      # 直接打包 Debug 版本，无需任何签名配置
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      # 上传打好的 APK
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tryptify-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
